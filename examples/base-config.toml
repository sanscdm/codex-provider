# Merge only the provider blocks you use into ~/.codex/config.toml.
# Keep credentials outside this file.

[model_providers.deepseek]
name = "DeepSeek"
base_url = "https://api.deepseek.com/"
wire_api = "responses"

[model_providers.deepseek.auth]
command = "codex-provider"
args = ["credential", "deepseek"]

[model_providers.openrouter]
name = "OpenRouter"
base_url = "https://openrouter.ai/api/v1"
wire_api = "responses"

[model_providers.openrouter.auth]
command = "codex-provider"
args = ["credential", "openrouter"]

[model_providers.amazon-bedrock.aws]
profile = "codex-bedrock"
region = "us-east-2"

[model_providers.azure-foundry]
name = "Microsoft Foundry"
base_url = "https://YOUR_RESOURCE.services.ai.azure.com/openai/v1"
wire_api = "responses"

[model_providers.azure-foundry.auth]
command = "az"
args = ["account", "get-access-token", "--resource", "https://ai.azure.com", "--query", "accessToken", "--output", "tsv"]
