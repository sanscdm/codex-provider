[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-provider"
version = "0.2.0"
description = "Safely switch Codex desktop model providers while keeping native CLI profiles."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Santiago Toro" }]
keywords = ["codex", "model-provider", "openai", "deepseek", "amazon-bedrock"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: MacOS",
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
  "tomlkit>=0.13,<1",
]

[project.scripts]
codex-provider = "codex_provider.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
